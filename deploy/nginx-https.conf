server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name shabeghahremanan.ir www.shabeghahremanan.ir 45.156.185.150;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://shabeghahremanan.ir$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.shabeghahremanan.ir;
    ssl_certificate /etc/letsencrypt/live/shabeghahremanan.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shabeghahremanan.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://shabeghahremanan.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shabeghahremanan.ir;
    ssl_certificate /etc/letsencrypt/live/shabeghahremanan.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shabeghahremanan.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
