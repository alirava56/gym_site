server {
    listen 80;
    listen [::]:80;
    server_name test.shabeghahremanan.ir;
    location / { return 301 https://test.shabeghahremanan.ir$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.shabeghahremanan.ir;
    ssl_certificate /etc/letsencrypt/live/test.shabeghahremanan.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.shabeghahremanan.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
